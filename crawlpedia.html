<style>
/* Layout concept: a dark encyclopedia article. One full-viewport canvas sits over the page and draws the creature,
   plus every text effect (dimming, swaps, floating tags), so the article's own DOM is never touched while it animates. */
:root{
  --bg:#030008;          /* page ground: the canvas covers eaten words with this exact value */
  --ink:#e6e6eb;
  --mute:#8d8b98;
  --rule:#3a3841;
  --line:#27252f;
  --acc:#c98ae9;         /* links, wordmark and infobox heads take the current species' colour */
  --frame:#27252f;
  --serif:"Linux Libertine","Libertinus Serif","Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.68 var(--sans);-webkit-text-size-adjust:100%;overflow-x:hidden}
html.imm,html.imm body{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:150px}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
.burger{width:30px;height:30px;padding:3px;background:none;border:0;color:var(--ink);cursor:pointer;flex:none}
.burger svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.wm{font:600 25px/1 var(--serif);font-variant:small-caps;letter-spacing:.03em;color:var(--acc);white-space:nowrap}
.acct{margin-left:auto;display:flex;gap:14px;font-size:13px;white-space:nowrap}
.acct a{color:var(--acc);text-decoration:none}
@media (max-width:480px){.acct a:first-child{display:none}.wm{font-size:22px}}
@media (max-width:380px){.acct a:nth-child(2){display:none}.top{gap:8px}}

/* title + tabs */
.tb{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:5px}
h1{font:400 clamp(25px,7.4vw,34px)/1.15 var(--serif);margin:6px 0 0;min-width:0;overflow-wrap:anywhere}
.count{font:700 13px/1 var(--sans);color:var(--acc);background:none;border:0;padding:8px 0 5px;cursor:pointer;white-space:nowrap;flex:none}
.tabs{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 12px;border-bottom:1px solid var(--rule);margin-bottom:14px;font-size:13px}
.tabs a{display:inline-block;padding:9px 1px 8px;margin-right:14px;color:var(--acc);text-decoration:none;border-bottom:2px solid transparent}
.tabs div:last-child a{margin-right:0;margin-left:14px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}

/* habitat */
.habwrap{height:clamp(250px,50vw,390px);margin:0 0 20px}
.habitat{position:relative;height:100%;border:1px solid var(--line);background:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/25% 100%}
.hb{position:absolute;width:46px;height:46px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;background:rgba(3,0,8,.55);color:#c9c7d3;cursor:pointer;z-index:1}
.hb.tr{top:10px;right:10px}.hb.bl{bottom:10px;left:10px}.hb.br{bottom:10px;right:10px}
.hb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hb[aria-pressed="true"].bm svg{fill:currentColor}
.hb[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.hint{position:absolute;left:62px;right:62px;bottom:12px;margin:0;text-align:center;font-size:12px;line-height:1.4;color:var(--mute);transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}
.hname{display:none;position:absolute;left:16px;top:14px;font:italic 15px var(--serif);color:var(--mute)}
html.imm .habwrap{position:relative}
html.imm .habitat{position:fixed;inset:0;height:auto;z-index:5;border:0;background-color:var(--bg)}
html.imm .hname{display:block}
html.imm .hint{left:80px;right:80px}
html.imm .top,html.imm .tb,html.imm .tabs,html.imm #article,html.imm .auto{visibility:hidden}
html.imm .hb.tr{top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
html.imm .hb.bl{bottom:max(12px,env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px))}
html.imm .hb.br{bottom:max(12px,env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px))}

/* article */
#article{min-height:60vh}
#article h2{font:400 clamp(22px,5.8vw,27px)/1.2 var(--serif);border-bottom:1px solid var(--rule);margin:30px 0 12px;padding-bottom:3px}
#article h3{font:700 16px/1.3 var(--sans);margin:22px 0 8px}
#article p{margin:0 0 13px}
#article ul,#article ol{margin:0 0 13px;padding-left:1.7em}
#article li{margin-bottom:3px}
#article a.l{color:var(--acc);text-decoration:none}
#article sup.r{font-size:.72em;color:var(--acc);opacity:.85;line-height:0}
#article ol.refs{font-size:14px;line-height:1.7;padding-left:1.9em}
#article ol.refs li{margin-bottom:7px;overflow-wrap:anywhere}

.ib{border:1px solid var(--line);background:var(--bg);padding:12px 14px 14px;margin:2px 0 18px;font-size:13.5px;line-height:1.55}
.ibimg{display:flex;justify-content:center;color:#d6d4df;padding:2px 0 8px}
.ibimg svg{width:132px;height:auto;max-width:100%}
.ibn{text-align:center;font-style:italic;color:var(--acc);margin-bottom:6px}
.ibh{text-align:center;font-weight:700;color:var(--acc);margin:8px 0 6px}
.ib table{border-collapse:collapse;width:100%}
.ib td{padding:2px 10px 2px 0;vertical-align:top}
.ib td:first-child{white-space:nowrap}
.ibc{text-align:center;margin-top:10px}
.fig{border:1px solid var(--frame);background:var(--bg);padding:10px;margin:6px 0 18px;max-width:360px}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:12.5px;line-height:1.45;margin-top:8px}
@media (min-width:700px){
  .ib{float:right;width:270px;margin:4px 0 16px 24px}
  .fig{float:right;clear:right;width:300px;margin:6px 0 16px 24px}
}

/* canvas overlay */
#fx{position:fixed;left:0;top:0;pointer-events:none;z-index:6}

/* species drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,90vw);background:#07040e;border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font:600 20px var(--serif)}
.dh button{width:36px;height:36px;background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:20px;line-height:1}
.dtools{display:flex;gap:8px;padding:6px 16px 8px}
.dtools input{flex:1;min-width:0;background:#0e0a17;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:3px;font:14px var(--sans)}
.dtools button,.more{background:none;border:1px solid var(--acc);color:var(--acc);padding:0 14px;border-radius:3px;cursor:pointer;font:13px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 16px 10px}
.chips button{border:1px solid var(--line);background:none;color:var(--mute);padding:6px 11px;border-radius:999px;font:12px var(--sans);cursor:pointer}
.chips button.on{color:var(--ink);border-color:var(--acc)}
#dList{list-style:none;margin:0;padding:0 0 24px;overflow:auto;flex:1;overscroll-behavior:contain}
#dList button.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid #15111d;padding:12px 16px;cursor:pointer;font:14px var(--sans)}
#dList button.row.cur{background:#120d1d}
#dList .nm{flex:1;font-style:italic;min-width:0;overflow-wrap:anywhere}
#dList .kd{color:var(--mute);font-size:12px}
#dList .sw{width:10px;height:10px;border-radius:50%;flex:none}
#dList .more{display:block;margin:14px 16px;padding:10px 14px}
.empty{padding:18px 16px;color:var(--mute);font-size:13px}

/* floating controls */
.auto{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(8,5,16,.86);color:var(--ink);font:12px/1 var(--sans);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap}
.auto i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.auto.on i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.auto.paused i{animation:none;opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:calc(100vw - 32px);background:#14101e;border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:4px;font-size:13px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hint,.toast{transition:none}}
</style>

function UL(a){return '<ul>'+a.map(function(x){return '<li>'+rt(x)+'</li>'}).join('')+'</ul>'}
function OL(a,c){return '<ol class="'+(c||'')+'">'+a.map(function(x){return '<li>'+rt(x)+'</li>'}).join('')+'</ol>'}

/* small line drawings for the infobox */
function glyph(kind){
  var s='<svg viewBox="0 0 120 84" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" aria-hidden="true">',i;
  if(kind==='arachnid'){
    var ky=[10,28,52,72],fy=[24,40,66,80],hy=[30,36,42,48];
    for(i=0;i<4;i++)s+='<path d="M54 '+hy[i]+'L30 '+ky[i]+'L14 '+fy[i]+'"/><path d="M66 '+hy[i]+'L90 '+ky[i]+'L106 '+fy[i]+'"/>';
    s+='<rect x="53" y="22" width="14" height="14"/><rect x="50" y="38" width="20" height="24"/><rect x="57" y="27" width="4" height="4"/><path d="M54 46h12M54 52h12"/>';
  }else if(kind==='insect'){
    s+='<rect x="54" y="10" width="12" height="12"/><rect x="50" y="24" width="20" height="18"/><rect x="52" y="44" width="16" height="30"/>';
    s+='<path d="M57 10L48 2M63 10L72 2M50 29L30 20L16 30M50 35L28 40L14 52M50 40L32 58L20 74M70 29L90 20L104 30M70 35L92 40L106 52M70 40L88 58L100 74"/>';
    s+='<path d="M54 52h12M54 58h12M54 64h12"/>';
  }else{
    for(i=0;i<7;i++){var y=6+i*10,o=Math.sin(i*.55)*7;
      s+='<rect x="'+(53+o)+'" y="'+y+'" width="14" height="9"/><path d="M'+(53+o)+' '+(y+4)+'L'+(40+o)+' '+(y+2)+'L'+(30+o)+' '+(y+8)+'M'+(67+o)+' '+(y+4)+'L'+(80+o)+' '+(y+2)+'L'+(90+o)+' '+(y+8)+'"/>'}
  }

function infobox(sp){
  var k=sp.kind,legs=k==='arachnid'?8:k==='insect'?6:(sp.segs-1)*2;
  var cls=k==='arachnid'?'Arachnomorpha':k==='myriapod'?'Chilopodomorpha':'Hexapodomorpha';
  var ord=k==='arachnid'?'Araneomimes':k==='myriapod'?'Scolopendromimes':'Lexicoptera';
  function rows(a){return a.map(function(r){return '<tr><td>'+rt(r[0])+'</td><td>'+rt(r[1])+'</td></tr>'}).join('')}
  var cls1=[['Kingdom:','Crawlera'],['Phylum:','Arthropodomorpha'],['Class:',cls],['Order:',ord],['Family:',sp.fam],['Genus:',sp.genus],['Species:',sp.epi.toLowerCase()]];
  var ana=[['Legs:',String(legs)],k==='myriapod'?['Segments:',String(sp.segs)]:['Gait:',k==='arachnid'?'Alternating':'Tripod'],['Diet:','Text']];
  return '<aside class="ib"><div class="ibimg">'+glyph(k)+'</div>'+
    '<div class="cap ibn">'+rt(sp.genus+' '+sp.epi.toLowerCase())+'</div>'+
    '<div class="cap ibh">'+rt('Scientific classification')+'</div><table>'+rows(cls1)+'</table>'+
    '<div class="cap ibh">'+rt('Anatomy')+'</div><table>'+rows(ana)+'</table>'+
    '<div class="cap ibc">'+rt('See //Crawler taxonomy//.')+'</div>'+
    '<div class="cap ibh">'+rt('Diversity^[1]')+'</div><div class="cap ibc">'+rt('1111 species')+'</div></aside>';
}

    '<path d="M10 56H45M45 22V89M45 22H186M45 89H80M80 58V120M80 58H186M80 120H115M115 94V146M115 94H186M115 146H150M150 130V162M150 130H186M150 162H186"/>'+
    '<g stroke="none" fill="#d6d4df" '+t+'><text x="192" y="26">Scutigeromorpha</text><text x="192" y="62">Lithobiomorpha</text><text x="192" y="98">Craterostigmomorpha</text><text x="192" y="134">Scolopendromorpha</text><text x="192" y="166">Geophilomorpha</text></g>'+
    '<g stroke="none" style="fill:var(--acc)" '+t+' font-style="italic"><text x="50" y="17">Notostigmophora</text><text x="86" y="84">Pleurostigmophora</text><text x="154" y="143">Epimorpha</text></g>'+
    '</svg><div class="cap">'+rt('Relationships among the five orders of centipedes, after molecular studies.')+'</div></div>';

function leadArachnid(sp){return [
  '**'+sp.name+'** is a crawler, a procedurally animated digital creature that lives in the margins of web pages and feeds on text. It is modelled on the true spiders ([[Araneae]]) and has the same basic body plan: two body sections, eight legs and no antennae.^[1]',
  'Crawlers of this species walk with an alternating gait, lifting four legs at a time. When a foot lands on a word, the word is flagged, chewed and sometimes swapped for another word from the same page. Most of the damage heals within a minute.'
]}
function bodyArachnid(){return [
  H2('Description'),
  P_('Spiders are [[chelicerates]], arthropods whose body is divided into two parts: a front section called the cephalothorax and a rear section called the abdomen. Unlike insects, they have no antennae and no wings. The cephalothorax carries the eyes, the mouthparts and four pairs of walking legs, and a narrow waist, the pedicel, joins it to the abdomen.^[2]'),
  P_('Most spiders have eight eyes, though the number ranges from none in some cave species to six or four in others. Spiders cannot chew. They inject digestive enzymes into their prey and drink the liquefied tissue. Their nervous system is highly centralised, with the ganglia fused into one mass in the cephalothorax. Spiders have no extensor muscles in their legs and straighten them instead by raising the pressure of the fluid inside.^[2]'),
  H2('Silk and webs'),
  P_('The abdomen carries [[spinnerets]], appendages that extrude silk from as many as six types of silk gland. Silk is used for much more than webs: spiders wrap prey, build egg sacs, line burrows and drift on air currents on a single thread, a habit called ballooning. Web designs vary widely in shape, size and the amount of sticky thread used. Not all spiders build webs. Wolf spiders and jumping spiders hunt their prey directly.'),
  H2('Diet'),
  P_('Spiders are predators, and the great majority feed on insects. Most detect prey by touch, through vibrations in a web or in the ground that fine hairs and slit-shaped sensory organs on the legs pick up. Jumping spiders hunt by sight. A few species also eat pollen or nectar, and one, //Bagheera kiplingi//, feeds mainly on plant tissue.^[3] One estimate puts the prey eaten by all the world\'s spiders at 400 to 800 million tonnes a year.^[4]'),
  H2('Fossil history'),
  P_('Silk-making arachnids with no true spinnerets are known from the Devonian. True spiders appear in rocks that are between about 318 and 299 million years old, and they closely resemble the most primitive living suborder, the [[Mesothelae]].^[5] The two main groups of modern spiders, [[Mygalomorphae]] and [[Araneomorphae]], first appear in the Triassic, more than 200 million years ago.^[6]'),
  H2('Taxonomy'),
  P_('Spiders form the order [[Araneae]], named by Clerck in 1757. More than 52,000 species in 139 families are recognised, and the order ranks seventh in species diversity among all orders of organisms.^[1] There are two suborders: the Mesothelae, which keep a segmented abdomen, and the Opisthothelae, which holds the tarantulas and trapdoor spiders (Mygalomorphae) and the true spiders (Araneomorphae).'),
  H2('Further reading'),
  OL(refsSpider,'refs')
].join('')}

/* ----- myriapod ----- */
var refsMyria=[
  'Edgecombe, Gregory D.; Giribet, Gonzalo (2007). "Evolutionary biology of centipedes (Myriapoda: Chilopoda)". //Annual Review of Entomology//. **52**: 151–170.',
  'Minelli, Alessandro, ed. (2011). //Treatise on Zoology – Anatomy, Taxonomy, Biology: The Myriapoda//. Vol. 1. Leiden: Brill.',
  'Molinari, Jesús; et al. (2005). "Predation by giant centipedes, //Scolopendra gigantea//, on three species of bats in a Venezuelan cave". //Caribbean Journal of Science//. **41** (2): 340–346.',
  'Shear, William A.; Edgecombe, Gregory D. (2010). "The geological record and phylogeny of the Myriapoda". //Arthropod Structure & Development//. **39** (2–3): 174–190.'
];
function leadMyria(sp){return [
  '**'+sp.name+'** is a crawler modelled on the centipedes: a long, flexible body of repeated segments with a pair of legs on each.^[1] This species has '+sp.segs+' segments and '+((sp.segs-1)*2)+' legs and moves in a travelling wave, leaving a trail of faded text behind it.',
  'Where its body passes, words lose their colour and some of them are replaced. The text recovers after a while.'
]}
function bodyMyria(sp){return [
  H2('Description'),
  P_('Centipedes (class [[Chilopoda]]) are predatory arthropods with long, flattened bodies. The trunk is made of repeated segments, each carrying one pair of legs, which separates them from millipedes, whose segments carry two pairs.^[2] The number of leg pairs is always odd and ranges from 15 to 191, depending on the species.^[1]'),
  P_('The first pair of legs is modified into [[forcipules]], venomous claws used to seize and kill prey. The last pair, the ultimate legs, is often long and thin and works as a sensory organ, and in some species as a pincer. Centipedes breathe through a tracheal system that opens at paired spiracles. They lack the waxy cuticle of insects and arachnids, so they lose water quickly and need damp places to live.'),
  H2('Diet and behaviour'),
  P_('Centipedes are generalist carnivores. They hunt insects, spiders, worms and snails, and the largest tropical species take lizards, frogs, mice and even bats.^[3] Most hunt at night and shelter by day under stones, bark and leaf litter. They find prey with their antennae, which are covered in sensory hairs, and many have poor eyesight or none at all.'),
  H2('Classification'),
  P_('Five orders are recognised: [[Scutigeromorpha]] (house centipedes), [[Lithobiomorpha]] (stone centipedes), [[Craterostigmomorpha]] (two species, in Tasmania and New Zealand), [[Scolopendromorpha]] and [[Geophilomorpha]] (soil centipedes).^[1]'),
  figClade(),
  P_('An older scheme split the class into Anamorpha (Lithobiomorpha and Scutigeromorpha) and Epimorpha (Geophilomorpha and Scolopendromorpha), according to how the young develop, and left the position of the Craterostigmomorpha uncertain. Anamorphic species hatch with few segments and add more as they moult. Epimorphic species hatch with the full number. Molecular studies support the Epimorpha as a group within the Pleurostigmophora but find the Anamorpha to be paraphyletic.^[1]'),
  UL(['The head is flattened and carries one pair of antennae.','The first pair of legs is modified into venomous forcipules.','Each trunk segment carries a single pair of legs.','Species develop either by anamorphosis or by epimorphosis.']),
  H2('Fossil history'),
  P_('The fossil record of centipedes reaches back to the Silurian, more than 400 million years ago.^[4] Cretaceous amber preserves centipedes that are close to living forms, so the main groups were probably in place well before the end of the age of the dinosaurs.'),
  H2('Further reading'),
  OL(refsMyria,'refs')
].join('')}

var refsInsect=[
  'Gullan, P.J.; Cranston, P.S. (2014). //The Insects: An Outline of Entomology//. 5th ed. Chichester: Wiley-Blackwell.',
  'Chapman, R.F.; Simpson, S.J.; Douglas, A.E., eds. (2013). //The Insects: Structure and Function//. 5th ed. Cambridge: Cambridge University Press.',
  'Conner, William E.; Corcoran, Aaron J. (2012). "Sound strategies: the 65-million-year-old battle between bats and insects". //Annual Review of Entomology//. **57**: 21–39.',
  'Misof, Bernhard; et al. (2014). "Phylogenomics resolves the timing and pattern of insect evolution". //Science//. **346** (6210): 763–767.'
];
function leadInsect(sp){return [
  '**'+sp.name+'** is a crawler modelled on the insects: a body in three parts, six legs and a pair of antennae.^[1] It collects keywords. As it moves it lifts words off the page, turns them into tags and carries them around itself for a while before putting them back.',
  'The tags are chosen from words of four letters or more. Short function words are left where they are.'
]}
function bodyInsect(){return [
  H2('External anatomy'),
  P_('Insects (class [[Insecta]]) have a body divided into three parts: the head, the thorax and the abdomen. The head bears a pair of antennae, compound eyes, usually three simple eyes called ocelli, and the mouthparts.^[2] The thorax has three segments, named from front to back the prothorax, mesothorax and metathorax. Each carries a pair of legs, and the last two usually carry the wings.'),
  P_('The abdomen is the largest part of most insects, with up to eleven segments, and is less heavily armoured than the head or thorax. Each segment has a hardened upper plate, the tergum, and a lower plate, the sternum, joined by flexible membrane.'),
  H2('Circulatory system'),
  P_('Insects have an open circulatory system. The blood, called haemolymph, is pumped forward by a tubular heart along the back, in waves of contraction, and then flows freely among the organs. It carries nutrients and waste but little oxygen, which reaches the tissues through the tracheae, a branching network of air-filled tubes that open at spiracles along the thorax and abdomen.^[2]'),
  H2('Nervous system'),
  P_('The central nervous system has a brain in the head and a ventral nerve cord that runs along the underside of the body, with a ganglion in each segment or group of fused segments. The brain receives signals from the eyes and antennae, and much of the local control of the legs is handled by the ganglia.'),
  H2('Communication'),
  P_('Insects communicate with chemicals, sound, light, touch and vibration. Crickets and grasshoppers make sound by stridulation, drawing a scraper over a file-like ridge, and many have tympanal organs, thin membranes on the legs or abdomen, that pick up airborne sound. Others send vibrations through plant stems or the ground, a method that suits insects living among dense vegetation, where sound carries poorly.^[1]'),
  P_('Some moths produce ultrasonic clicks that warn bats of their unpalatability, a strategy called acoustic aposematism, and others are thought to jam bat sonar.^[3] Social insects such as ants, termites and bees rely heavily on pheromones. A honey bee returning to the hive dances to tell its nestmates the direction of a food source relative to the sun and the distance to be flown.'),
  H2('Parasitism'),
  P_('Many insects live as parasites or parasitoids. Fleas and lice feed on the blood or skin of mammals and birds, while parasitoid wasps lay their eggs in or on other insects and the larvae eat the host from within. Some insects, mosquitoes among them, are vectors that carry the pathogens of human disease.'),
  H2('Care of young'),
  P_('Most insects abandon their eggs, but there are many exceptions. Earwigs guard their eggs and young, some bugs stay with their nymphs, and social insects rear their brood in nests, where workers feed the larvae.'),
  H2('Modern diversity'),
  P_('More than a million insect species have been described, roughly two thirds of all known animal species, and estimates of the true number run to several million.^[1] Phylogenomic studies date the origin of insects to the Ordovician, about 480 million years ago.^[4]'),
  H2('Further reading'),
  OL(refsInsect,'refs')
].join('')}

function articleHTML(sp){
  var k=sp.kind,lead=k==='arachnid'?leadArachnid(sp):k==='myriapod'?leadMyria(sp):leadInsect(sp);
  var body=k==='arachnid'?bodyArachnid():k==='myriapod'?bodyMyria(sp):bodyInsect(sp);
  return infobox(sp)+lead.map(function(x){return P_(x)}).join('')+body;
}
/* ================= word store: measured once, drawn on the canvas ================= */
var N=0,X,Y,WD,HT,FLG,FS,RH,DUR,BLANK,ST=null,T0,RES,CI;
var FONT=[],TXT=[],REP=[],byLen=[];
var rowsM=new Map(),ROWH=40;
var act=new Set();
var habR={x:0,y:0,w:0,h:0},docH=0;
var stats={eaten:0};
var MAXTAGS=MOBILE?22:34;
var BG='#030008',INK='#e6e6eb',accCss='#c98ae9';

function measure(){
  var els=art.querySelectorAll('.w'),n=els.length;
  var sx=window.pageXOffset||0,sy=window.pageYOffset||0;
  var realloc=(n!==N)||!ST;
  N=n;
  X=new Float32Array(n);Y=new Float32Array(n);WD=new Float32Array(n);HT=new Float32Array(n);
  FLG=new Uint8Array(n);FS=new Float32Array(n);RH=new Float32Array(n);
  FONT=new Array(n);TXT=new Array(n);byLen=[];rowsM=new Map();
  var cache=new Map(),i,el,r,blk,m,cl,f,k,a,L,cs;
  for(i=0;i<n;i++){
    el=els[i];r=el.getBoundingClientRect();
    X[i]=r.left+sx;Y[i]=r.top+sy;WD[i]=r.width;HT[i]=r.height;
    cl=el.className;f=0;
    if(cl.indexOf('k1')>-1)f|=1;if(cl.indexOf('k2')>-1)f|=2;if(cl.indexOf('k4')>-1)f|=4;
    FLG[i]=f;
    blk=el.closest('p,li,h2,h3,td,th,.cap')||el.parentNode;
    m=cache.get(blk);
    if(!m){cs=getComputedStyle(blk);m={fs:parseFloat(cs.fontSize)||15,ff:cs.fontFamily,fw:cs.fontWeight,fi:cs.fontStyle};cache.set(blk,m)}
    FS[i]=m.fs;
    FONT[i]=(((f&4)||m.fi==='italic')?'italic ':'')+((f&2)?'700':m.fw)+' '+m.fs+'px '+m.ff;
    TXT[i]=el.textContent;
    RH[i]=hash(i);
    k=Math.floor((Y[i]+HT[i]/2)/ROWH);a=rowsM.get(k);if(!a){a=[];rowsM.set(k,a)}a.push(i);
    L=TXT[i].length;(byLen[L]||(byLen[L]=[])).push(i);
  }
  if(realloc){
    ST=new Uint8Array(n);T0=new Float32Array(n);RES=new Float32Array(n);CI=new Uint8Array(n);
    DUR=new Float32Array(n);BLANK=new Uint8Array(n);REP=new Array(n);act.clear();tags.length=0;
  }
  var wr=habwrap.getBoundingClientRect();
  habR={x:wr.left+sx,y:wr.top+sy,w:wr.width,h:wr.height};
  docH=Math.max(rootEl.scrollHeight,document.body.scrollHeight);
  var cs2=getComputedStyle(rootEl).getPropertyValue('--acc').trim();if(cs2)accCss=cs2;
}

/* ----- state changes ----- */
function bite(i){
  if(ST[i]!==0)return;
  ST[i]=1;T0[i]=now;CI[i]=Math.floor(rnd()*8);DUR[i]=.7+rnd()*.9;REP[i]=null;BLANK[i]=0;
  act.add(i);stats.eaten++;
  if(rnd()<.3)sfx('chew');
}
function dimWord(i){
  if(ST[i]!==0)return;
  ST[i]=3;T0[i]=now;RES[i]=now+24+rnd()*40;REP[i]=null;act.add(i);
}
function touchAt(x,y,rad,p){
  if(!N||imm||p<=0)return;
  var k0=Math.floor((y-rad)/ROWH),k1=Math.floor((y+rad)/ROWH),best=-1,bd=1e9,k,a,j,i,dx,dy,d,r2=rad*rad;
  for(k=k0;k<=k1;k++){
    a=rowsM.get(k);if(!a)continue;
    for(j=0;j<a.length;j++){
      i=a[j];if(ST[i]!==0)continue;
      dx=Math.max(X[i]-x,0,x-(X[i]+WD[i]));dy=Math.max(Y[i]-y,0,y-(Y[i]+HT[i]));d=dx*dx+dy*dy;
      if(d<=r2&&d<bd){bd=d;best=i}
    }
  }
  if(best>=0&&rnd()<p)bite(best);
}
function dimAround(x,y,r,p){
  if(!N||imm)return;
  var k0=Math.floor((y-r)/ROWH),k1=Math.floor((y+r)/ROWH),k,a,j,i,dx,dy,r2=r*r;
  for(k=k0;k<=k1;k++){
    a=rowsM.get(k);if(!a)continue;
    for(j=0;j<a.length;j++){
      i=a[j];if(ST[i]!==0||RH[i]>=p)continue;
      dx=Math.max(X[i]-x,0,x-(X[i]+WD[i]));dy=Math.max(Y[i]-y,0,y-(Y[i]+HT[i]));
      if(dx*dx+dy*dy<=r2)dimWord(i);
    }
  }
}
function restoreAll(){
  act.forEach(function(i){ST[i]=0;REP[i]=null});
  act.clear();tags.length=0;
}
function pickRep(i){
  var L=TXT[i].length,a=byLen[L+Math.floor(rnd()*3)-1]||byLen[L];
  if(!a||!a.length)return null;
  var j=a[Math.floor(rnd()*a.length)];
  if(j===i||TXT[j]===TXT[i])return null;
  var t=TXT[j];
  if(rnd()<.14){t=t+(rnd()<.5?'-':'/')+TXT[a[Math.floor(rnd()*a.length)]]}
  return t;
}
function spawnTag(i){
  var p=cr.pal,col=p.tags[Math.floor(rnd()*p.tags.length)];
  tags.push({i:i,txt:TXT[i],x:X[i]+WD[i]/2,y:Y[i]+HT[i]/2,vx:(rnd()-.5)*80,vy:(rnd()-.5)*80,a:0,ta:0,
    fs:Math.round(FS[i]*(.9+rnd()*.4)),w:0,born:now,life:9+rnd()*10,rad:(34+rnd()*190)*cr.S,
    om:(rnd()<.5?-1:1)*(.3+rnd()*.8),ph:rnd()*TAU,col:col,line:rnd()<.14});
  ST[i]=4;T0[i]=now;act.add(i);
}

function updateWords(){
  var t=now;
  act.forEach(function(i){
    var s=ST[i],age=t-T0[i];
    if(s===1){
      if(age>.16){ST[i]=2;T0[i]=t;BLANK[i]=rnd()<.14?1:0;if(!BLANK[i]&&rnd()<.62)REP[i]=pickRep(i)}
    }else if(s===2){
      if(age>DUR[i]){
        if(cr&&cr.pal.tags&&tags.length<MAXTAGS&&!BLANK[i]&&!REP[i]&&TXT[i].length>=4&&/[A-Za-z]{4}/.test(TXT[i])&&rnd()<.6)spawnTag(i);
        else{ST[i]=3;T0[i]=t;RES[i]=t+24+rnd()*36}
      }
    }else if(s===3){
      if(t>RES[i]){ST[i]=0;REP[i]=null;act.delete(i)}
    }
  });
}
function updateTags(dt){
  if(!cr)return;
  for(var k=tags.length-1;k>=0;k--){
    var t=tags[k],age=now-t.born,tx,ty,kk;
    if(age<t.life){
      var ang=t.ph+t.om*age;
      tx=cr.cx+Math.cos(ang)*t.rad;ty=cr.cy+Math.sin(ang)*t.rad*.8;kk=3.4;
      t.ta=ang+PI/2+Math.sin(age*1.3+t.ph)*.9;
    }else{
      tx=X[t.i]+WD[t.i]/2;ty=Y[t.i]+HT[t.i]/2;kk=10;t.ta=0;
      var dx=tx-t.x,dy=ty-t.y;
      if(dx*dx+dy*dy<25||age>t.life+2.4){ST[t.i]=3;T0[t.i]=now;RES[t.i]=now+8+rnd()*18;tags.splice(k,1);continue}
    }

var KX=0,KY=0,FX2=0,FY2=0;

/* two-bone IK; (ox,oy) says which way the knee should bend. Writes KX,KY (knee) and FX2,FY2 (foot, clamped to reach). */
function ik(hx,hy,fx,fy,l1,l2,ox,oy){
  var dx=fx-hx,dy=fy-hy,d=Math.sqrt(dx*dx+dy*dy)||1e-4,mx=l1+l2-.5,mn=Math.abs(l1-l2)+.5;

}

/* a planted foot stays put until it is too far from where it should be, then it steps */
function stepLeg(c,L,hx,hy,rx,ry,vx,vy,dt,allow,Rw,reach){
  if(L.st>=0){
    L.st+=dt/L.dur;
    if(L.st>=1){L.st=-1;L.fx=L.tx;L.fy=L.ty;L.lift=0;c.plant(L)}
    else{var u=L.st,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;L.fx=L.sx+(L.tx-L.sx)*e;L.fy=L.sy+(L.ty-L.sy)*e;L.lift=Math.sin(u*PI)}

  var ex=L.fx-hx,ey=L.fy-hy,hd=Math.sqrt(ex*ex+ey*ey);

    L.st=0;L.sx=L.fx;L.sy=L.fy;

}

Myriapod.prototype.draw=function(){

/* ================= sound (off until the speaker button is pressed) ================= */
var AC=null,audioOn=false,nzBuf=null,lastTick=0;
function audioToggle(){
  try{
    if(!AC){
      var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
      AC=new C();var len=Math.floor(AC.sampleRate*.5),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0),i;
      for(i=0;i<len;i++)d[i]=Math.random()*2-1;
      nzBuf=b;
    }
    audioOn=!audioOn;
    if(audioOn&&AC.state==='suspended')AC.resume();
    return audioOn;
  }catch(e){audioOn=false;return false}
}
function sfx(kind){
  if(!audioOn||!AC)return;
  var t=AC.currentTime;if(t-lastTick<.03)return;lastTick=t;
  try{
    var src=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
    src.buffer=nzBuf;bp.type='bandpass';
    if(kind==='step'){bp.frequency.value=1800+Math.random()*2200;bp.Q.value=5;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035)}
    else{bp.frequency.value=500+Math.random()*500;bp.Q.value=2;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09)}
    src.connect(bp);bp.connect(g);g.connect(AC.destination);src.start(t,Math.random()*.3,.1);
  }catch(e){}
}

/* ================= brain: where the creature wants to go ================= */
function pickWander(){
  if(!cr)return;
  var x0,x1,y0,y1,inHab=false,tx=null,ty=null,k,a,i,tries;
  if(imm){x0=30;x1=VW-30;y0=scrollY+30;y1=scrollY+VH-30}
  else{
    var inside=cr.cx>=habR.x&&cr.cx<=habR.x+habR.w&&cr.cy>=habR.y&&cr.cy<=habR.y+habR.h;
    var vis=habR.y+habR.h>scrollY+80&&habR.y<scrollY+VH-80;
    if(inside&&vis){inHab=true;x0=habR.x+56;x1=habR.x+habR.w-56;y0=Math.max(habR.y+34,scrollY+30);y1=Math.min(habR.y+habR.h-34,scrollY+VH-30)}
    else{x0=18;x1=VW-18;y0=scrollY+70;y1=scrollY+VH-90}
  }
  if(!inHab&&!imm&&N){
    for(tries=0;tries<10;tries++){
      k=Math.floor((y0+rnd()*(y1-y0))/ROWH);a=rowsM.get(k);
      if(!a||!a.length)continue;
      i=a[Math.floor(rnd()*a.length)];
      if(ST[i]!==0)continue;
      tx=X[i]+WD[i]/2;ty=Y[i]+HT[i]/2;break;
    }
  }
  if(tx===null){tx=x0+rnd()*Math.max(1,x1-x0);ty=y0+rnd()*Math.max(1,y1-y0)}
  brain.tx=tx;brain.ty=ty;
  brain.nextPick=now+(cr.kind==='myriapod'?3.5+rnd()*3:2+rnd()*3);
}
function autoLabel(){
  var b=$('autoBtn'),s=!auto.on?'off':auto.armed?'on':'paused';
  if(b._s===s)return;b._s=s;
  $('autoTx').textContent=s==='off'?'Autopilot off':s==='on'?'Autopilot on':'Autopilot paused';
  b.classList.toggle('on',s==='on');b.classList.toggle('paused',s==='paused');
  b.setAttribute('aria-pressed',auto.on?'true':'false');
}
function nextSpecies(){
  var i=1+Math.floor(rnd()*(SPN-1));
  loadSpecies(i,{delay:0});
  toast('Next species: '+curSp.name);
}
function think(dt){
  if(!cr)return;
  var lure=P.active&&(P.down||now-P.last<(P.touch?3.5:5));
  auto.armed=auto.on&&!lure&&now-auto.lastUser>7&&!imm&&!drawerOpen;   /* nothing is holding autopilot back */
  auto.running=auto.armed&&now>auto.start;                              /* ...and the start delay has passed */
  if(lure){
    brain.mode='lure';
    brain.orbit+=dt*(cr.kind==='myriapod'?.9:2.1);
    var rr=cr.millR*cr.S*(cr.kind==='myriapod'?1:.55);
    brain.tx=P.x+Math.cos(brain.orbit)*rr;brain.ty=P.y+scrollY+Math.sin(brain.orbit)*rr;
    brain.speed=P.down?1.5:1.2;
  }else if(auto.running){
    if(brain.mode!=='auto'){brain.mode='auto';auto.y=Math.max(cr.cy,habR.y+habR.h*.5);auto.ph=0;auto.sy=scrollY;auto.done=0}
    auto.ph+=dt*.5;
    var lim=docH-VH*.34,close=Math.hypot(cr.cx-auto.x,cr.cy-auto.y)<(230*cr.S+70);
    if(close&&auto.y<lim)auto.y+=40*dt;
    auto.x=VW/2+Math.sin(auto.ph)*Math.min(VW*.36,300);
    brain.tx=auto.x;brain.ty=auto.y;brain.speed=.8;
    var want=clamp(auto.y-VH*.4,0,Math.max(0,docH-VH));
    auto.sy+=(want-auto.sy)*Math.min(1,dt*1.8);
    window.scrollTo(0,auto.sy);auto.set=true;
    if(auto.y>=lim-2){if(!auto.done)auto.done=now;else if(now-auto.done>2.5){auto.done=0;nextSpecies();return}}
  }else{
    if(brain.mode!=='wander'){brain.mode='wander';brain.nextPick=0}
    brain.speed=.85;
    if(now>brain.nextPick||Math.hypot(cr.cx-brain.tx,cr.cy-brain.ty)<26*cr.S)pickWander();
  }
  if(!imm&&(cr.cy<scrollY-VH*.7||cr.cy>scrollY+VH*1.7))
    cr.teleport(clamp(cr.cx,40,VW-40),cr.cy<scrollY?scrollY+24:scrollY+VH-24);
  autoLabel();
}

art.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('a'))e.preventDefault()});

/* ================= frame loop ================= */
function drawRing(){
  if(!P.active)return;
  var idle=now-P.last,a;
  if(P.touch)a=P.down?1:Math.max(0,1-(idle-.2)/1.2);
  else a=idle<3?1:Math.max(0,1-(idle-3)/1.2);
  if(a<=0)return;
  var R=clamp(VW*.06,24,46)*(P.down?.82:1);
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,'+(.62*a).toFixed(3)+')';
  ctx.beginPath();ctx.arc(P.x,P.y,R,0,TAU);ctx.stroke();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  drawWords();
  ctx.save();ctx.translate(0,-scrollY);
  if(oldCr)oldCr.draw();
  if(cr)cr.draw();
  ctx.restore();
  drawTags();
  drawRing();
}
var lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var t=ts/1000;if(!lastT)lastT=t;
  var dt=Math.min(.05,t-lastT);lastT=t;now=t;
  scrollY=window.pageYOffset||rootEl.scrollTop||0;
  var dsy=scrollY-lastSY;lastSY=scrollY;
  var ours=auto.set&&Math.abs(scrollY-auto.sy)<=2.5;
  if(dsy!==0&&!ours){userInput();if(cr)cr.carry(dsy*.9);if(oldCr)oldCr.carry(dsy*.9)}
  if(!ours&&!auto.running)auto.sy=scrollY;
  auto.set=false;
  think(dt);
  if(cr)cr.update(dt);
  if(oldCr){oldCr.alpha=1-(now-oldCr.fade)/.5;if(oldCr.alpha<=0)oldCr=null;else oldCr.update(dt)}
  updateWords();updateTags(dt);
  draw();
}

/* ================= start ================= */
var roT=0;
try{if(window.matchMedia&&!window.matchMedia('(pointer:coarse)').matches)$('hint').textContent='Move the cursor to lure the crawler. Scroll to send it into the article.'}catch(e){}
resize(true);
loadSpecies(0,{delay:4});
requestAnimationFrame(frame);
window.addEventListener('resize',function(){resize(false)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){resize(true)});
window.addEventListener('load',function(){resize(true)});
if(window.ResizeObserver){new ResizeObserver(function(){clearTimeout(roT);roT=setTimeout(measure,120)}).observe(art)}
window.__cw={load:loadSpecies,species:species,get cr(){return cr},P:P,auto:auto,brain:brain,stats:stats,setImm:setImm,measure:measure,act:act,tags:tags};
})();
</script>
